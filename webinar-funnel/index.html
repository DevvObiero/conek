<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F1F5F9" />
  <title>The In-House Marketing Workshop | Free Live Workshop for Chiropractors</title>
  <meta name="description"
    content="Burned by agencies? Learn to run your own marketing and turn the treatments you already offer into high-ticket cash programs. Free live workshop, Wednesday November 4 at 9 PM Eastern." />
  <script>
    // Brand default is light. Only a saved choice from the toggle switches to dark.
    (function () {
      var t;
      try { t = localStorage.getItem('theme'); } catch (e) { }
      if (t !== 'dark') t = 'light';
      document.documentElement.dataset.theme = t;
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'dark' ? '#0F172A' : '#F1F5F9');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
