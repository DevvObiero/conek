<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>Free Training: How to Turn Your Treatments into High-Ticket Cash Programs</title>
  <meta name="description"
    content="A free live training for chiropractors and physical therapists on packaging care into high-ticket cash programs. Wednesday, November 4, 2026 at 9:00 PM ET." />
  <script>
    // Set the theme before first paint: saved choice, else the OS setting.
    (function () {
      var t;
      try { t = localStorage.getItem('theme'); } catch (e) { }
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = t;
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'light' ? '#e9e9ec' : '#000000');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>

</body>

</html>
